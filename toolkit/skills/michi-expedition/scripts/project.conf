# build-html.sh config: the project library (the default).
#
# One entry per line, fields separated by "|":
#   role|<id>|<tab title>|<one-line blurb>
#   intro|<what the "First time here?" callout calls the tl;dr>
#   shared|<file>|<label>[|<html name>]          for every role (the tl;dr and the glossary)
#   doc|<file>|<label>|<role>[,<role>...]        a library document; a part's folder uses the same names.
#                                                The first role owns the page; later roles list it too.
#   link|<path>|<label>|<role>[|<requires>]      a repo file the sidebar links to as it is
#   page|<path>|<html name>|<label>|<role>       a file outside the library, built as a page
# Paths are relative to the library folder, or to the repo root with a leading "/". A link is added only
# when its <requires> file exists in the library. Sidebar order follows this file.
# A library's own documents beyond the templates go in <library>/library.conf: doc lines only, for these
# roles, listed after the documents here.

role|observer|For observers|What it is, why it exists, and where it's going.
role|practitioner|For practitioners|Installing it and using it.
role|contributor|For contributors|Setting up to work on it, and what's next.
intro|project intro

shared|tldr.md|First time here?|index.html
shared|glossary.md|Glossary

doc|overview.md|Overview|observer
doc|reading-guide.md|Reading guide|observer
doc|roadmap.md|Roadmap|observer
doc|getting-started.md|Getting started|practitioner
doc|hello-world.md|Hello world|practitioner
doc|usage-guide.md|Usage guide|practitioner
doc|limitations.md|Limitations|practitioner
doc|faq.md|FAQ|practitioner
doc|reference.md|Reference|practitioner
doc|upgrading.md|Upgrading|practitioner
doc|changelog.md|Changelog|practitioner
doc|contributor-guide.md|Contributor guide|contributor
link|/ARCHITECTURE.md|Architecture|contributor|contributor-guide.md
doc|backlog.md|Backlog|contributor
link|/STATUS.md|Status|contributor|contributor-guide.md
